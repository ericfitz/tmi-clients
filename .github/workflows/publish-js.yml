name: Publish JavaScript Client to npm

on:
  release:
    types: [published]
  # Manual dry run: installs, builds and tests a committed client. The
  # publish step below stays gated on `release`, so a dispatch never publishes.
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 2.0.1; resolves to the newest committed directory with the same major.minor (dry run — does not publish)"
        required: true
        type: string

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/ts-v')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write  # npm trusted publishing (OIDC); provenance is automatic
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine release version and client directory
        id: version
        # Both sources are untrusted-ish (a dispatch input, a tag name), and the
        # result becomes a filesystem path, so pass them through env: rather than
        # ${{ }} interpolation. The resolver rejects anything that is not a bare
        # N.N.N and picks the committed directory with the same major.minor and
        # the highest patch <= the release version (ADR 0003).
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            RELEASE_VERSION="$INPUT_VERSION"
          else
            RELEASE_VERSION="${GITHUB_REF_NAME#ts-v}"
          fi
          python3 .github/scripts/resolve_client_dir.py --lang ts --version "$RELEASE_VERSION" --github-output
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Trusted publishing needs npm >= 11.5.1 / Node >= 22.14; Node 24 bundles npm 11.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: ${{ steps.version.outputs.pkg_dir }}/package-lock.json

      # The committed directory carries the spec version. A client-only fix
      # release publishes a different version (ADR 0003): stamp it into
      # package.json and package-lock.json of this checkout before npm ci.
      - name: Stamp release version
        working-directory: ${{ steps.version.outputs.pkg_dir }}
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        working-directory: ${{ steps.version.outputs.pkg_dir }}
        run: npm ci

      - name: Build
        working-directory: ${{ steps.version.outputs.pkg_dir }}
        run: npm run build

      - name: Run tests
        working-directory: ${{ steps.version.outputs.pkg_dir }}
        # --if-present skips versions with no "test" script; --passWithNoTests
        # keeps vitest from failing a version whose test script finds no tests.
        run: npm run test --if-present -- --passWithNoTests

      - name: Publish to npm
        # Never publish from a manual dry run.
        if: github.event_name == 'release'
        working-directory: ${{ steps.version.outputs.pkg_dir }}
        # Authenticates via OIDC; the trusted publisher on npmjs.com names this
        # repo, publish-js.yml, and the npm environment. No token.
        run: npm publish --access public
