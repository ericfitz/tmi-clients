name: Validate Go Client

on:
  release:
    types: [published]
  # Manual dry run. This workflow only builds and tests — it never publishes —
  # so a dispatch is equivalent to the release path.
  workflow_dispatch:
    inputs:
      version:
        description: "Client version to validate, e.g. 1.8.3 (dotted, not underscored)"
        required: true
        type: string

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/go-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the Go module tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine version directory
        id: version
        # Both sources are untrusted-ish (a dispatch input, a tag name), and the
        # result becomes a filesystem path, so pass them through env: rather than
        # ${{ }} interpolation and reject anything that is not a bare N.N.N.
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG_VERSION="$INPUT_VERSION"
          else
            TAG_VERSION="${GITHUB_REF_NAME#go-v}"
          fi
          if ! printf '%s' "$TAG_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version '$TAG_VERSION' (expected N.N.N)"
            exit 1
          fi
          # Go version dirs use underscores (v1_4_0), not dots.
          echo "go_dir=go-client-generated/v${TAG_VERSION//./_}" >> "$GITHUB_OUTPUT"
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify version directory exists
        run: |
          if [ ! -d "${{ steps.version.outputs.go_dir }}" ]; then
            echo "::error::Directory ${{ steps.version.outputs.go_dir }} does not exist"
            exit 1
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ steps.version.outputs.go_dir }}/go.mod
          cache-dependency-path: ${{ steps.version.outputs.go_dir }}/go.sum

      - name: Build
        working-directory: ${{ steps.version.outputs.go_dir }}
        run: go build ./...

      - name: Test
        working-directory: ${{ steps.version.outputs.go_dir }}
        run: go test -v ./...

      # The module lives in a subdirectory, so Go resolves versions only from
      # tags prefixed with that subdirectory (go-client-generated/v1_15_0/v1.15.0).
      # The release tag (go-v1.15.0) is not one Go understands.
      - name: Push Go module tag
        if: github.event_name == 'release'
        env:
          MODULE_TAG: ${{ steps.version.outputs.go_dir }}/v${{ steps.version.outputs.version }}
        run: |
          existing=$(git ls-remote --tags origin "refs/tags/$MODULE_TAG" | cut -f1)
          if [ -n "$existing" ]; then
            if [ "$existing" = "$GITHUB_SHA" ]; then
              echo "$MODULE_TAG already points at $GITHUB_SHA"
              exit 0
            fi
            echo "::error::$MODULE_TAG already exists at $existing, not $GITHUB_SHA"
            exit 1
          fi
          git tag "$MODULE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$MODULE_TAG"
