name: Security Audit

# Proactive vulnerability + regen-drift sweep across every client version.
# Dependabot covers security *updates*; this catches anything outstanding
# between regenerations and fails (notifying the repo) when something is found.
on:
  schedule:
    - cron: "0 8 * * 1" # Mondays 08:00 UTC (offset from the CodeQL scan)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Derive version matrices from the committed client directories (see ci.yml).
  setup:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.matrix.outputs.versions }}
      go_versions: ${{ steps.matrix.outputs.go_versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: matrix
        run: |
          versions=$(ls -d python-client-generated/v[0-9]*/ 2>/dev/null \
            | sed 's#.*/v##; s#/##' \
            | jq -Rsc 'split("\n") | map(select(length > 0))')
          go_versions=$(ls -d go-client-generated/v[0-9]*/ 2>/dev/null \
            | sed 's#.*/v##; s#/##' \
            | jq -Rsc 'split("\n") | map(select(length > 0))')
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
          echo "go_versions=$go_versions" >> "$GITHUB_OUTPUT"

  audit-python:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    defaults:
      run:
        working-directory: python-client-generated/v${{ matrix.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: pip-audit
        # Environment mode: uv's standalone Python ships without pip, so
        # pip-audit's default `-r` venv builder fails. Audit the installed
        # dists instead.
        run: uv run --with pip-audit --with-requirements requirements.txt pip-audit

  audit-node:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.versions) }}
    defaults:
      run:
        working-directory: typescript-client-generated/v${{ matrix.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: typescript-client-generated/v${{ matrix.version }}/package-lock.json
      - run: npm ci
      - name: npm audit
        # Report everything, then gate the job on high/critical findings.
        run: |
          npm audit || true
          npm audit --audit-level=high

  audit-go:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.setup.outputs.go_versions) }}
    defaults:
      run:
        working-directory: go-client-generated/v${{ matrix.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Use a current Go toolchain rather than each module's older go.mod
          # version: govulncheck@latest needs Go >= 1.25, and auditing against
          # the current stdlib is what we want. The modules build fine under a
          # newer Go (it is backward compatible).
          go-version: "stable"
          cache-dependency-path: go-client-generated/v${{ matrix.version }}/go.sum
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  regen-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check regen-script dependency pins for major drift
        run: python3 check_regen_drift.py

  # This workflow is scheduled and does not gate PRs, so a failure is otherwise
  # silent — it went unnoticed for three weeks in July 2026. File (or comment on)
  # a tracking issue instead, so a failing audit surfaces in normal repo traffic.
  notify-on-failure:
    # `setup` is listed explicitly: if it fails the audit jobs are *skipped*
    # rather than failed, and the alert must still fire.
    needs: [setup, audit-python, audit-node, audit-go, regen-drift]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the audit-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="Security audit failed"
          LABEL="security-audit"

          # Idempotent: the label may not exist yet on a fresh repo.
          gh label create "$LABEL" --repo "$REPO" \
            --color B60205 --description "Automated security-audit failures" \
            2>/dev/null || true

          BODY=$(printf '%s\n\n%s\n' \
            "The scheduled \`Security Audit\` workflow failed. It does not gate pull requests, so this issue is the only notification." \
            "Failing run: $RUN_URL")

          EXISTING=$(gh issue list --repo "$REPO" --state open --label "$LABEL" \
            --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body "$BODY"
            echo "Commented on existing issue #$EXISTING"
          else
            gh issue create --repo "$REPO" --title "$TITLE" \
              --label "$LABEL" --body "$BODY"
          fi
