name: Publish Python Client

on:
  release:
    types: [published]
  # Manual dry run: builds and tests a committed client version without
  # publishing anything, so action-version bumps in this file can be validated
  # without cutting a release. The publish jobs below stay gated on `release`.
  workflow_dispatch:
    inputs:
      version:
        description: "Client version directory to build, e.g. 1.8.3 (dry run — does not publish)"
        required: true
        type: string

jobs:
  build-and-test:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/python-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Determine version directory
        id: version
        # Both sources are untrusted-ish (a dispatch input, a tag name), and the
        # result becomes a filesystem path, so pass them through env: rather than
        # ${{ }} interpolation and reject anything that is not a bare N.N.N.
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG_VERSION="$INPUT_VERSION"
          else
            TAG_VERSION="${GITHUB_REF_NAME#python-v}"
          fi
          if ! printf '%s' "$TAG_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version '$TAG_VERSION' (expected N.N.N)"
            exit 1
          fi
          echo "tag_version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          echo "pkg_dir=python-client-generated/v${TAG_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify version directory exists
        run: |
          if [ ! -d "${{ steps.version.outputs.pkg_dir }}" ]; then
            echo "::error::Directory ${{ steps.version.outputs.pkg_dir }} does not exist"
            exit 1
          fi

      - name: Install build tools
        run: pip install build

      - name: Install package with test dependencies
        working-directory: ${{ steps.version.outputs.pkg_dir }}
        run: pip install -e ".[test]" || pip install -e .

      - name: Verify package version matches tag
        working-directory: ${{ steps.version.outputs.pkg_dir }}
        run: |
          PKG_VERSION=$(python -c "import tmi_client; print(tmi_client.__version__)" 2>/dev/null || python -c "from importlib.metadata import version; print(version('tmi-client'))")
          TAG_VERSION="${{ steps.version.outputs.tag_version }}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Package version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Run tests
        working-directory: ${{ steps.version.outputs.pkg_dir }}
        # pytest exit code 5 means "no tests collected" — treat that as success
        # so a version with an empty test/ dir doesn't fail. Real test failures
        # (exit 1) still fail.
        run: |
          pip install pytest
          code=0
          pytest test/ -v --tb=short || code=$?
          if [ "$code" -eq 5 ]; then
            echo "pytest collected no tests (exit 5) — treating as success"
            exit 0
          fi
          exit "$code"

      - name: Build package
        working-directory: ${{ steps.version.outputs.pkg_dir }}
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist
          path: ${{ steps.version.outputs.pkg_dir }}/dist/

  publish-testpypi:
    needs: build-and-test
    # Never publish from a manual dry run.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: publish-testpypi
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
