name: Publish Python Client

on:
  release:
    types: [published]
  # Manual dry run: builds and tests a committed client without
  # publishing anything, so action-version bumps in this file can be validated
  # without cutting a release. `publish_testpypi` extends that to a real
  # TestPyPI upload — the one step a dry run cannot otherwise reach, since
  # gh-action-pypi-publish is only exercised by an actual upload. PyPI itself
  # stays gated on `release` regardless.
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 2.0.1; resolves to the newest committed directory with the same major.minor"
        required: true
        type: string
      publish_testpypi:
        description: "Publish to TestPyPI under a throwaway .devN version (never touches PyPI)"
        required: false
        default: false
        type: boolean

jobs:
  build-and-test:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/python-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Determine release version and client directory
        id: version
        # Both sources are untrusted-ish (a dispatch input, a tag name), and the
        # result becomes a filesystem path, so pass them through env: rather than
        # ${{ }} interpolation. The resolver rejects anything that is not a bare
        # N.N.N and picks the committed directory with the same major.minor and
        # the highest patch <= the release version (ADR 0003).
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            RELEASE_VERSION="$INPUT_VERSION"
          else
            RELEASE_VERSION="${GITHUB_REF_NAME#python-v}"
          fi
          python3 .github/scripts/resolve_client_dir.py --lang python --version "$RELEASE_VERSION" --github-output

      # The committed directory carries the spec version. A client-only fix
      # release publishes a different version, so stamp it into the package
      # metadata of this checkout (a no-op when the two are equal).
      - name: Stamp release version
        env:
          PKG_DIR: ${{ steps.version.outputs.pkg_dir }}
          SPEC_VERSION: ${{ steps.version.outputs.spec_version }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: python3 .github/scripts/stamp_python_version.py --dir "$PKG_DIR" --from "$SPEC_VERSION" --to "$RELEASE_VERSION"

      - name: Install build tools
        run: pip install build

      - name: Install package with test dependencies
        working-directory: ${{ steps.version.outputs.pkg_dir }}
        run: pip install -e ".[test]" || pip install -e .

      - name: Verify package version matches tag
        working-directory: ${{ steps.version.outputs.pkg_dir }}
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          PKG_VERSION=$(python -c "import tmi_client; print(tmi_client.__version__)" 2>/dev/null || python -c "from importlib.metadata import version; print(version('tmi-client'))")
          if [ "$PKG_VERSION" != "$RELEASE_VERSION" ]; then
            echo "::error::Package version ($PKG_VERSION) does not match release ($RELEASE_VERSION)"
            exit 1
          fi

      - name: Run tests
        working-directory: ${{ steps.version.outputs.pkg_dir }}
        # pytest exit code 5 means "no tests collected" — treat that as success
        # so a version with an empty test/ dir doesn't fail. Real test failures
        # (exit 1) still fail.
        run: |
          pip install pytest
          code=0
          pytest test/ -v --tb=short || code=$?
          if [ "$code" -eq 5 ]; then
            echo "pytest collected no tests (exit 5) — treating as success"
            exit 0
          fi
          exit "$code"

      # Only for a TestPyPI dispatch. TestPyPI rejects a re-upload of a version
      # it already has ("file already exists"), so a repeatable test needs a
      # version nobody will ever claim. run_number makes each dispatch unique,
      # and a PEP 440 .devN suffix keeps the real version numbers free. This
      # runs *after* the version-match check and the tests, so both still see
      # the stamped release version.
      - name: Stamp a throwaway dev version for TestPyPI
        if: inputs.publish_testpypi
        working-directory: ${{ steps.version.outputs.pkg_dir }}
        env:
          BASE_VERSION: ${{ steps.version.outputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          DEV_VERSION="${BASE_VERSION}.dev${RUN_NUMBER}"
          echo "Building throwaway version $DEV_VERSION for TestPyPI"
          python - "$DEV_VERSION" <<'PY'
          import pathlib, re, sys
          dev = sys.argv[1]
          for path, pattern, repl in (
              ("pyproject.toml", r'^version = ".*"', f'version = "{dev}"'),
              ("setup.py", r'^VERSION = ".*"', f'VERSION = "{dev}"'),
          ):
              p = pathlib.Path(path)
              text = p.read_text()
              new, count = re.subn(pattern, repl, text, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f"::error::no version line matched in {path}")
              p.write_text(new)
              print(f"stamped {path}")
          PY

      - name: Build package
        working-directory: ${{ steps.version.outputs.pkg_dir }}
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist
          path: ${{ steps.version.outputs.pkg_dir }}/dist/

  publish-testpypi:
    needs: build-and-test
    # A release always publishes. A manual dispatch publishes only when
    # explicitly asked, and then only the throwaway .devN build stamped above.
    if: github.event_name == 'release' || inputs.publish_testpypi
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          # A re-run after a TestPyPI success must still reach PyPI.
          skip-existing: true

  publish-pypi:
    needs: publish-testpypi
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
